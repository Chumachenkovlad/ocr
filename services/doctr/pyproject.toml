[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-doctr-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-doctr[torch]>=0.9.0",
    "torch>=2.0.0,<2.6.0",
    "Pillow>=11.0.0",
    "pdf2image>=1.17.0",
    "structlog>=24.4.0",
    "ocr-schema",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
