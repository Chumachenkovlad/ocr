[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-gateway"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.27.0",
    "ocr-schema",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
