[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr-schema"
version = "0.1.0"
description = "Unified OCR output schema shared across services"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ocr_schema"]
